[package]
name = "omniget-plugin-study"
version = "0.13.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
omniget-core = { path = "../../omniget-core", features = ["desktop"] }
omniget-plugin-sdk = { path = "../../omniget-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
