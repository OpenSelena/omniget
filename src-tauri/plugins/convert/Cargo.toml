[package]
name = "libreget-plugin-convert"
version = "1.0.3"
edition = "2021"


[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
libreget-core = { path = "../../libreget-core", features = ["desktop"] }
libreget-plugin-sdk = { path = "../../libreget-plugin-sdk" }
