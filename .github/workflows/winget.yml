# Issue #203: the winget manifest drifted seven releases behind because it was
# submitted by hand. Runs when a draft release is published (not on tag push —
# drafts have no public download URLs yet) and opens a PR against
# microsoft/winget-pkgs. Requires the WINGET_TOKEN secret: a classic PAT with
# public_repo scope, used by wingetcreate to fork and open the PR.
# "wingetcreate update" only works once OpenSelena.OmniGet exists in
# winget-pkgs: submit packaging/winget/ by hand first (docs/windows-signing.md).
name: Publish to winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.8.9)'
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Submit manifest update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::warning::WINGET_TOKEN secret not set - skipping winget submission"
            exit 0
          }
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/OmniGet_${version}_x64-setup.exe"
          # Pinned release + SHA-256 (from the GitHub release asset digest) so a
          # replaced download can never run with WINGET_TOKEN.
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') {
            throw "wingetcreate.exe SHA-256 mismatch: $hash"
          }
          .\wingetcreate.exe update OpenSelena.OmniGet `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_TOKEN
