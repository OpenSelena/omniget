# Issue #203: the winget manifest drifted seven releases behind because it was
# submitted by hand. Runs when a draft release is published (not on tag push —
# drafts have no public download URLs yet) and opens a PR against
# microsoft/winget-pkgs. Requires the WINGET_TOKEN secret: a classic PAT with
# public_repo scope, used by wingetcreate to fork and open the PR.
name: Publish to winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.8.9)'
        required: true

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Submit manifest update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::warning::WINGET_TOKEN secret not set - skipping winget submission"
            exit 0
          }
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/omniget_${version}_x64-setup.exe"
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          .\wingetcreate.exe update tonhowtf.OmniGet `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_TOKEN
