name: SignPath Test Signing

on:
  workflow_dispatch:

jobs:
  test-sign-windows:
    name: Test Sign Windows Binary
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build OmniGet Windows application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --no-bundle

      - name: Upload unsigned executable for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-omniget-binary
          path: src-tauri/target/release/omniget.exe
          if-no-files-found: error

      - name: Submit test-signing request to SignPath
        id: signpath-test
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '773e0b25-f263-45c9-8f29-c7a6a1aed6db'
          project-slug: 'omniget'
          signing-policy-slug: 'test-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600
          output-artifact-directory: 'signed-output'

      - name: Verify Authenticode Signature
        shell: pwsh
        run: |
          $signed = Get-ChildItem "signed-output" -Filter "*.exe" | Select-Object -First 1
          if (-not $signed) {
            throw "No signed binary found in signed-output"
          }
          Write-Host "Found signed binary: $($signed.FullName)"
          $sig = Get-AuthenticodeSignature $signed.FullName
          $sig | Format-List *
          Write-Host "=========================================="
          Write-Host "Signer Certificate Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Signer Certificate Issuer:  $($sig.SignerCertificate.Issuer)"
          Write-Host "Status:                     $($sig.Status)"
          Write-Host "StatusMessage:              $($sig.StatusMessage)"
          Write-Host "=========================================="

      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-omniget-test-binary
          path: signed-output/*.exe
